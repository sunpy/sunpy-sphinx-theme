[tox]
min_version = 4.0
envlist =
    build_docs{,-devdeps}
    sunpy_docs{,-devdeps}
    website{,-devdeps}
    a11y{,-firefox}
# convenience label to build the docs and run the accessibility tests, e.g.
# tox run -m a11y
labels =
    a11y = build_docs, a11y

[testenv]
allowlist_externals=
    /bin/sh
    /usr/bin/git
    /usr/bin/make
pass_env =
    # A variable to tell tests we are on a CI system
    CI
    # Custom compiler locations (such as ccache)
    CC
    # Location of locales (needed by sphinx on some systems)
    LOCALE_ARCHIVE
    # If the user has set a LC override we should follow it
    LC_ALL
set_env =
    MPLBACKEND = agg
    SUNPY_SAMPLEDIR = {env:SUNPY_SAMPLEDIR:{toxinidir}/.tox/{envname}/sample_data/}
    HIDE_PARFIVE_PROGRESS = True
deps =
    devdeps: git+https://github.com/pydata/pydata-sphinx-theme.git

[testenv:build_docs{,-devdeps}]
changedir = docs
description = Invoke sphinx-build to build the HTML docs
extras =
    docs
commands =
    pip freeze --all --no-input
    sphinx-build -j auto --color -W --keep-going -b html -d _build/.doctrees . _build/html -a {posargs}
    python -c 'import pathlib; print("Package Docs available under file://\{0\}".format(pathlib.Path(r"{toxinidir}").absolute() / "docs" / "_build" / "html" / "index.html"))'

# Run the accessibility tests with Playwright and axe-core.
# The documentation these tests run against has to be built first, either by
# running the build_docs env first (tox run -e build_docs,a11y or tox run -m
# a11y) or by having a docs/_build/html directory from a manual build.
# Node.js and npm are needed to install axe-core, and running the tests
# downloads the Playwright browser binaries on first run.
# Traces of failing tests are written to the test-results directory.
[testenv:a11y]
description = "run accessibility tests with Playwright and axe-core (chromium)"
depends =
    build_docs
extras =
    test
allowlist_externals =
    playwright
    npm
    bash
commands =
    bash -c 'test -d docs/_build/html/ && echo "--- Docs build exists ---" || exit -1'
    npm install
    bash -c 'if [[ "{env:CI:}" == "true" ]]; then playwright install --with-deps chromium; else playwright install chromium; fi'
    pytest -m "a11y" --maxfail=1 --browser=chromium {posargs:--tracing=retain-on-failure}

[testenv:a11y-firefox]
description = "run accessibility tests with Playwright and axe-core (firefox)"
depends =
    build_docs
extras =
    test
allowlist_externals =
    playwright
    npm
    bash
commands =
    bash -c 'test -d docs/_build/html/ && echo "--- Docs build exists ---" || exit -1'
    npm install
    bash -c 'if [[ "{env:CI:}" == "true" ]]; then playwright install --with-deps firefox; else playwright install firefox; fi'
    pytest -m "a11y" --maxfail=5 --browser=firefox {posargs:--tracing=retain-on-failure}

[testenv:sunpy_docs{,-devdeps}]
changedir = .tmp/{envname}
commands =
    /bin/sh -c "git -C sunpy pull || git clone https://github.com/sunpy/sunpy"
    python -m pip install -v -e "sunpy/.[all,docs]"
    pip freeze --all --no-input
    sphinx-build --color -b html sunpy/docs sunpy/docs/_build/html -D plot_gallery=0 -a {posargs}
    python -c 'import pathlib; print("Suny Docs available under file://\{0\}".format(pathlib.Path("./sunpy/docs").absolute() / "_build" / "html" / "index.html"))'

[testenv:website{,-devdeps}]
changedir = .tmp/{envname}
commands =
    /bin/sh -c "git -C sunpy.org pull || git clone --recurse-submodules https://github.com/sunpy/sunpy.org"
    python -m pip install -r "sunpy.org/requirements.txt"
    pip freeze --all --no-input
    sphinx-build --color -b dirhtml sunpy.org/ sunpy.org/_build/html -a {posargs}
    python -c 'import pathlib; print("Website available under file://\{0\}".format(pathlib.Path("./sunpy.org").absolute() / "_build" / "html" / "index.html"))'

[testenv:astropy_website{,-devdeps}]
changedir = .tmp/{envname}
commands =
    /bin/sh -c "git -C astropy.org pull || git clone --recurse-submodules https://github.com/astropy/astropy.github.com astropy.org"
    python -m pip install -r "astropy.org/requirements.txt"
    pip freeze --all --no-input
    sphinx-build --color -b dirhtml astropy.org/ astropy.org/_build/html -a {posargs}
    python -c 'import pathlib; print("Astropy website available under file://\{0\}".format(pathlib.Path("./astropy.org").absolute() / "_build" / "html" / "index.html"))'
