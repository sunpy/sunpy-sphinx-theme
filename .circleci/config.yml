version: 2.1
apt-run: &apt-install
  name: Install apt packages
  command: |
    sudo apt update
    sudo apt install -y graphviz build-essential libopenjp2-7 python3-dev pandoc libcairo2-dev
tox: &tox
  name: Setup tox
  command: |
    python -m pip install --upgrade tox
jobs:
  website:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      - run: python -m tox -e website -- -j 8
      - store_artifacts:
          path: .tmp/website/sunpy.org/_build/html
  astropy_website:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      - run: python -m tox -e astropy_website -- -j 8
      - store_artifacts:
          path: .tmp/astropy_website/astropy.org/_build/html
  sunpy:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      # Needed to install mplcairo
      - run: sudo apt install libcairo2-dev pkg-config
      # the large resource_class has 4 CPUs but auto detection does not work
      - run: python -m tox -e sunpy_docs -- -j 8
      # Remove some parts of the build to speed up upload
      - run: rm -r .tmp/sunpy_docs/sunpy/docs/_build/html/.doctrees
      - run: rm -r .tmp/sunpy_docs/sunpy/docs/_build/html/_downloads
      - run: rm -r .tmp/sunpy_docs/sunpy/docs/_build/html/_sources
      - store_artifacts:
          path: .tmp/sunpy_docs/sunpy/docs/_build/html
  sunpy-devdeps:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      # Needed to install mplcairo
      - run: sudo apt install libcairo2-dev pkg-config
      # the large resource_class has 4 CPUs but auto detection does not work
      - run: python -m tox -e sunpy_docs-devdeps -- -j 8
      # Remove some parts of the build to speed up upload
      - run: rm -r .tmp/sunpy_docs-devdeps/sunpy/docs/_build/html/.doctrees
      - run: rm -r .tmp/sunpy_docs-devdeps/sunpy/docs/_build/html/_downloads
      - run: rm -r .tmp/sunpy_docs-devdeps/sunpy/docs/_build/html/_sources
      - store_artifacts:
          path: .tmp/sunpy_docs-devdeps/sunpy/docs/_build/html
  css_linting:
    resource_class: small
    docker:
      - image: cimg/node:current
    steps:
      - checkout
      - run: sudo npm install -g stylelint
      - run: sudo npm install stylelint-config-recommended
      - run: sudo stylelint "**/*.{css,scss,sass}"
  tests:
    resource_class: small
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *tox
      - run: python -m tox -e py314
  a11y:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      # Node.js is needed to install axe-core for the accessibility tests
      - run: sudo apt install -y nodejs npm
      - run: *tox
      # Build the docs the accessibility tests are run against
      - run: python -m tox -e build_docs
      - run: python -m tox -e a11y
      # Make sure the trace directory exists so the artifact upload does not fail
      - run: mkdir -p test-results
      - store_artifacts:
          path: test-results
  visual:
    resource_class: large
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      # Build the docs the accessibility tests are run against
      - run: python -m tox -m visual
      # Make sure the trace directory exists so the artifact upload does not fail
      - run: mkdir -p test-results
      - store_artifacts:
          path: figure_test_images
  deploy-reference-images:
    parameters:
      jobname:
        type: string
    docker:
      - image: cimg/python:3.14
    environment:
      TOXENV: << parameters.jobname >>
    steps:
      - checkout
      - run: *apt-install
      - run: *tox
      # Clear out all the ssh keys so that it always uses the write deploy key
      - run: ssh-add -D
      # Register a write deploy key for sunpy/sunpy-figure-tests in the CircleCI
      # project SSH keys, then replace the fingerprint below.
      - add_ssh_keys:
          fingerprints: "SHA256:vJyM9ncnDErtqIxhQPRE5ARrZ1zwF9DNprMcFGlSYqY"
      - run: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: git config --global user.email "sunpy@circleci" && git config --global user.name "SunPy Circle CI"
      - run: git clone git@github.com:sunpy/sunpy-figure-tests.git --depth 1 -b sunpy-sphinx-theme-main /home/circleci/sunpy-figure-tests/
      # Build the docs the visual tests are run against
      - run: python -m tox -e build_docs
      # Generate reference images
      - run: rm -rf /home/circleci/sunpy-figure-tests/figures/$TOXENV/*
      - run: python -m tox -e $TOXENV -- --mpl-generate-path=/home/circleci/sunpy-figure-tests/figures/$TOXENV
      # Copy the committed hash library alongside the generated figures
      - run: cp src/sunpy_sphinx_theme/tests/screenshot_hashes.json /home/circleci/sunpy-figure-tests/figures/$TOXENV/
      - run: |
          cd /home/circleci/sunpy-figure-tests/
          git pull
          git status
          git add .
          git commit -m "Update reference figures from ${CIRCLE_BRANCH}" || echo "No changes to reference images to deploy"
          git push
workflows:
  version: 2
  tests:
    jobs:
      - css_linting
      - tests
      - a11y
      - visual
      - deploy-reference-images:
          name: baseline-<< matrix.jobname >>
          matrix:
            parameters:
              jobname:
                - "visual"
          requires:
            - visual
          filters:
            branches:
              only:
                - main
      - sunpy
      - website
      - sunpy-devdeps
      - astropy_website
